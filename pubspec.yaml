  rxdart: 0.28.0
  package_info_plus: 5.0.1
  share_plus: 7.2.2
  firebase_performance: 0.9.3+2
  collection: 1.18.0
  shared_preferences: 2.2.2

dev_dependencies:
  freezed_annotation: 2.4.4
  freezed: 2.5.7
